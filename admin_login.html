<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — Main</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1020; color: #eef2ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 410px); padding: 2rem; border: 1px solid #29314b; border-radius: 18px; background: #151d34; }
    a { color: #b9a5ff; text-decoration: none; }
    h1 { margin: 1.5rem 0 .5rem; letter-spacing: -.04em; }
    p { color: #aab3cd; line-height: 1.6; }
    label { display: block; margin: 1.5rem 0 .5rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: .9rem; border: 1px solid #3b4563; border-radius: 9px; background: #0b1020; color: #fff; font: inherit; }
    button { width: 100%; margin-top: .8rem; padding: .9rem; border: 0; border-radius: 9px; background: #a78bfa; color: #17112d; cursor: pointer; font: inherit; font-weight: 700; }
    .notice { padding: .8rem; border-radius: 8px; background: #40202d; color: #ffd9df; }
  </style>
</head>
<body>
  <main>
    <a href="/">← Main</a>
    <h1>Admin sign in</h1>
    <p>Sign in to manage the subscriber list.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="notice" role="alert">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
